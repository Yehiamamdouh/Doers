# Decap CMS configuration.
# Login uses a GitHub OAuth app through /api/github-oauth.php (credentials live on the server, not in the repo).
backend:
  name: github
  repo: Yehiamamdouh/Doers
  branch: main
  base_url: https://doersadv.com
  auth_endpoint: api/github-oauth.php
  commit_messages:
    create: 'Add {{collection}} “{{slug}}” from the dashboard'
    update: 'Update {{collection}} “{{slug}}” from the dashboard'
    delete: 'Delete {{collection}} “{{slug}}” from the dashboard'

publish_mode: editorial_workflow   # drafts and reviews before anything goes live
media_folder: site/public/img/uploads
public_folder: /img/uploads
locale: en

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: site/src/content/blog
    create: true
    slug: '{{slug}}'
    summary: '{{h1}}'
    sortable_fields: [date, title]
    fields:
      - { label: SEO title, name: title, widget: string, hint: 'The title shown in Google and the browser tab.' }
      - { label: Headline, name: h1, widget: string, required: false, hint: 'The big heading on the page. Leave empty to use the SEO title.' }
      - { label: SEO description, name: description, widget: text, hint: 'About 150 characters. Shown in Google results.' }
      - { label: Language, name: lang, widget: hidden, default: en }
      - { label: Publish date, name: date, widget: datetime }
      - { label: Last updated, name: updated, widget: datetime, required: false }
      - { label: Category, name: category, widget: string, required: false }
      - label: Related service
        name: service
        widget: select
        required: false
        options:
          - { label: 'Branding (Cairo)', value: /branding-agency-egypt/ }
          - { label: 'Events (Cairo)', value: /event-management-cairo-egypt/ }
          - { label: 'Booth production (Cairo)', value: /booth-production-egypt/ }
          - { label: 'Digital marketing (Cairo)', value: /digital-marketing-egypt-cairo/ }
          - { label: 'SEO (Cairo)', value: /seo/ }
          - { label: 'Web development (Cairo)', value: /website-development-company-egypt/ }
          - { label: 'Outdoor (Cairo)', value: /outdoor-advertising-egypt/ }
          - { label: 'Reputation management (Cairo)', value: /listening-and-reputation-management/ }
          - { label: 'Signage (Cairo)', value: /signage-internal-branding-egypt/ }
          - { label: 'Full-service agency (homepage)', value: / }
      - { label: Cover image, name: cover, widget: image, required: false }
      - { label: Cover image description, name: coverAlt, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: blog_ar
    label: Blog posts (Arabic)
    label_singular: Arabic blog post
    folder: site/src/content/blog/ar
    create: true
    slug: '{{slug}}'
    summary: '{{h1}}'
    sortable_fields: [date, title]
    fields:
      - { label: SEO title, name: title, widget: string }
      - { label: Headline, name: h1, widget: string, required: false }
      - { label: SEO description, name: description, widget: text }
      - { label: Language, name: lang, widget: hidden, default: ar }
      - { label: Hand translated, name: translated, widget: hidden, default: true }
      - { label: Publish date, name: date, widget: datetime }
      - { label: Last updated, name: updated, widget: datetime, required: false }
      - { label: Category, name: category, widget: string, required: false }
      - label: Related service
        name: service
        widget: select
        required: false
        options:
          - { label: 'Branding (Cairo)', value: /branding-agency-egypt/ }
          - { label: 'Events (Cairo)', value: /event-management-cairo-egypt/ }
          - { label: 'Booth production (Cairo)', value: /booth-production-egypt/ }
          - { label: 'Digital marketing (Cairo)', value: /digital-marketing-egypt-cairo/ }
          - { label: 'SEO (Cairo)', value: /seo/ }
          - { label: 'Web development (Cairo)', value: /website-development-company-egypt/ }
          - { label: 'Outdoor (Cairo)', value: /outdoor-advertising-egypt/ }
          - { label: 'Reputation management (Cairo)', value: /listening-and-reputation-management/ }
          - { label: 'Signage (Cairo)', value: /signage-internal-branding-egypt/ }
          - { label: 'Full-service agency (homepage)', value: / }
      - { label: Cover image, name: cover, widget: image, required: false }
      - { label: Cover image description, name: coverAlt, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: projects
    label: Projects & case studies
    label_singular: Project
    folder: site/src/content/projects
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Client, name: client, widget: string }
      - { label: Project title, name: title, widget: string }
      - { label: SEO description, name: description, widget: text }
      - { label: Year, name: year, widget: string, required: false }
      - { label: City, name: city, widget: string }
      - { label: Services, name: services, widget: list, hint: 'e.g. Booth Production, Event Management' }
      - { label: Cover photo, name: cover, widget: image }
      - { label: Gallery, name: gallery, widget: list, field: { label: Photo, name: photo, widget: image } }
      - { label: Vimeo video ID, name: vimeo, widget: string, required: false }
      - { label: The brief, name: brief, widget: text }
      - { label: What we did, name: body, widget: markdown }
      - { label: Results, name: results, widget: text, required: false }
